<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Seminar Hall - Seminar Hall Booking System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="app-navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fa-solid fa-building-columns"></i></div>
      <span>Seminar Hall <span style="color: #60A5FA; font-weight:400;">Booking System</span></span>
    </a>
    <div class="nav-links">
      <a href="calendar.html" class="nav-btn"><i class="fa-regular fa-calendar-days"></i> Calendar</a>
      <a href="booking.html" class="nav-btn active"><i class="fa-solid fa-plus-circle"></i> Book Slot</a>
      <a href="dashboard.html" class="nav-btn"><i class="fa-solid fa-clock-rotate-left"></i> My Requests</a>
      <a href="#" onclick="logout(); return false;" class="btn-nav-logout ms-2"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </div>
  </nav>

  <div class="page-container d-flex justify-content-center">
    <div class="ws-card" style="max-width: 680px; width: 100%;">
      
      <div class="ws-card-header">
        <div>
          <h3 class="ws-title"><i class="fa-solid fa-calendar-plus" style="color: var(--royal-blue);"></i> Book Seminar Hall</h3>
          <p class="ws-subtitle">Fill in the event details to request a hall reservation</p>
        </div>
      </div>

      <!-- HOLIDAY NOTICE ALERT BANNER -->
      <div id="holidayNotice" class="badge-rejected mb-3 p-3 text-start" style="display: none; border-radius: 10px; font-size: 0.9rem;"></div>

      <!-- DYNAMIC HALL AVAILABILITY SCHEDULE WIDGET -->
      <div id="availabilityBox" class="mb-3 p-3" style="display: none; background: #F8FBFF; border: 1px solid var(--border-color); border-left: 4px solid var(--royal-blue); border-radius: 8px;">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <strong style="color: var(--primary-navy); font-size: 0.88rem;">
            <i class="fa-solid fa-clock me-1" style="color: var(--royal-blue);"></i> Existing Occupied Slots for <span id="availDateLabel"></span>
          </strong>
          <span class="badge badge-approved" style="font-size: 0.75rem;">Operating Hours: 08:00 - 20:00</span>
        </div>
        <div id="availSlotsContent" style="font-size: 0.85rem; color: var(--main-text);">
          Checking availability...
        </div>
      </div>

      <form onsubmit="event.preventDefault(); book();">
        <div class="row g-3">
          
          <!-- DATE -->
          <div class="col-md-12">
            <div class="form-group">
              <label class="form-label"><i class="fa-regular fa-calendar me-1"></i> Booking Date</label>
              <input id="date" type="date" class="form-control" required>
            </div>
          </div>

          <!-- TIME SLOTS -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label"><i class="fa-regular fa-clock me-1"></i> Start Time</label>
              <input id="start" type="time" step="60" class="form-control" required>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label"><i class="fa-regular fa-clock me-1"></i> End Time</label>
              <input id="end" type="time" step="60" class="form-control" required>
            </div>
          </div>

          <!-- EVENT NAME -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-heading me-1"></i> Event Name</label>
              <input id="event" class="form-control" placeholder="e.g. AI & Robotics Workshop" required>
            </div>
          </div>

          <!-- DEPARTMENT -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-sitemap me-1"></i> Department / Club</label>
              <input id="dept" class="form-control" placeholder="e.g. Computer Engineering" required>
            </div>
          </div>

          <!-- EVENT DETAILS -->
          <div class="col-md-12">
            <div class="form-group">
              <label class="form-label"><i class="fa-solid fa-align-left me-1"></i> Event Details & Description</label>
              <textarea id="details" class="form-control" rows="3" placeholder="Provide brief summary, expected audience count, audio/visual requirements..."></textarea>
            </div>
          </div>

        </div>

        <div class="d-flex justify-content-end gap-3 mt-4">
          <a href="calendar.html" class="btn-ws-outline">Cancel</a>
          <button type="submit" class="btn-ws-primary">
            <i class="fa-solid fa-paper-plane"></i> Submit Request
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="app-footer">
    Seminar Hall Booking System &copy; 2026. All rights reserved.
  </footer>

  <script src="holidays.js"></script>
  <script src="script.js"></script>
</body>
</html>
